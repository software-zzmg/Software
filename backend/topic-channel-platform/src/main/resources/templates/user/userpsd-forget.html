<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body style="background:#f0f2f5;display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <div style="width:400px;">
        <h1 class="page-title" style="text-align:center;">忘记密码</h1>
        <p th:if="${error}" class="error-text" th:text="${error}"></p>

        <form method="post" th:action="@{/user/password/forgot/send-code}" class="form">
            <div class="form-group">
                <label>手机号：</label>
                <input type="text" name="phoneNumber" class="form-input" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">发送验证码</button>
                <a th:href="@{/user/login}" class="btn btn-outline">返回登录</a>
            </div>
        </form>

        <p th:if="${codeSent}" style="color:#16a34a;text-align:center;margin:12px 0;">验证码已发送（模拟：123456）</p>

        <form th:if="${codeSent}" method="post" th:action="@{/user/password/reset}" class="form" style="margin-top:16px;">
            <input type="hidden" name="phoneNumber" th:value="${resetPhone}">
            <div class="form-group">
                <label>验证码：</label>
                <input type="text" name="verificationCode" class="form-input" required>
            </div>
            <div class="form-group">
                <label>新密码：</label>
                <input type="password" name="newPassword" class="form-input" required>
            </div>
            <div class="form-group">
                <label>确认新密码：</label>
                <input type="password" name="confirmPassword" class="form-input" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">重置密码</button>
            </div>
        </form>
    </div>
</body>
</html>
