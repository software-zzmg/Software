<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body style="background:#f0f2f5;display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <div style="max-width:400px;width:90%;">
        <h1 class="page-title" style="text-align:center;">用户注册</h1>
        <p th:if="${error}" class="error-text" th:text="${error}"></p>

        <!-- 第一步：发送验证码 -->
        <form th:unless="${codeSent}" method="post" th:action="@{/user/register/send-code}" class="form">
            <div class="form-group">
                <label>手机号：</label>
                <input type="text" name="phoneNumber" class="form-input" th:classappend="${error != null && error.contains('手机号')} ? 'input-error'" th:value="${phoneNumber}" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">发送验证码</button>
                <a th:href="@{/user/login}" class="btn btn-outline">返回登录</a>
            </div>
        </form>

        <!-- 第二步：完成注册 -->
        <form th:if="${codeSent}" method="post" th:action="@{/user/register}" class="form">
            <input type="hidden" name="phoneNumber" th:value="${phoneNumber}">
            <p style="color:#16a34a;text-align:center;margin-bottom:12px;font-size:13px;">
                验证码已发送至 <strong th:text="${phoneNumber}"></strong>（模拟：123456）
            </p>

            <div class="form-group">
                <label>验证码：</label>
                <input type="text" name="verificationCode" class="form-input" th:classappend="${error != null && error.contains('验证码')} ? 'input-error'" required>
            </div>
            <div class="form-group">
                <label>用户名：</label>
                <input type="text" name="userName" class="form-input" th:value="${userName}" required>
            </div>
            <div class="form-group">
                <label>密码：</label>
                <input type="password" name="userPassword" class="form-input" required>
            </div>
            <div class="form-group">
                <label>确认密码：</label>
                <input type="password" name="confirmPassword" class="form-input" th:classappend="${error != null && error.contains('密码')} ? 'input-error'" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">注册</button>
                <a th:href="@{/user/register}" class="btn btn-outline">重新发送验证码</a>
            </div>
        </form>
    </div>
</body>
</html>
