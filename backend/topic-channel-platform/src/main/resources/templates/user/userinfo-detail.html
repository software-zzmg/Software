<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div style="max-width:600px;margin:0 auto;padding:24px;">
    <h1 class="page-title">个人信息</h1>

    <div class="table-wrapper"><table th:if="${user}" class="table">
        <tr><td>用户名：</td><td th:text="${user.userName}"></td></tr>
        <tr><td>手机号：</td><td th:text="${user.phoneNumber}"></td></tr>
        <tr><td>真实姓名：</td><td th:text="${user.realName}"></td></tr>
        <tr><td>性别：</td><td th:text="${user.gender}"></td></tr>
        <tr><td>生日：</td><td th:text="${user.birthday != null ? #strings.substring(user.birthday.toString(), 0, 10) : ''}"></td></tr>
        <tr><td>身份证号：</td><td th:text="${user.idNumber}"></td></tr>
        <tr><td>注册时间：</td><td th:text="${#strings.substring(user.registerTime.toString(), 0, 10)}"></td></tr>
    </table></div>
    <div class="form-actions">
        <a th:href="@{/user/info/edit}" class="btn btn-outline">编辑信息</a>
    </div>
    </div>
</body>
</html>
