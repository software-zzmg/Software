<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑主题频道</title>
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>
    <hr>

    <div style="display:flex;">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div style="flex:1;padding:15px;">

    <h1>编辑主题频道</h1>

    <p th:if="${error}" style="color:red" th:text="${error}"></p>

    <form method="post" th:action="@{/forum/edit}" th:if="${forum}">
        <input type="hidden" name="forumId" th:value="${forum.forumId}">
        <div>
            <label>频道名称：</label>
            <input type="text" name="forumName" th:value="${forum.forumName}" required>
        </div>
        <div>
            <label>频道简介：</label>
            <textarea name="content" rows="5" required th:text="${forum.content}"></textarea>
        </div>
        <div>
            <button type="submit">保存修改</button>
            <a th:href="@{/forum/detail/{id}(id=${forum.forumId})}">取消</a>
        </div>
    </form>
        </div>
    </div>
</body>
</html>
