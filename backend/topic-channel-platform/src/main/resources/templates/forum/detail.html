<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${forum.forumName} + ' - 频道详情'">频道详情</title>
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>
    <hr>

    <h1 th:text="${forum.forumName}">频道名称</h1>

    <p><strong>简介：</strong><span th:text="${forum.content}"></span></p>
    <p><strong>创建者：</strong><span th:text="${forum.creator.userName}"></span></p>
    <p><strong>审核状态：</strong><span th:text="${forum.auditState}"></span></p>
    <p><strong>创建时间：</strong><span th:text="${forum.createTime}"></span></p>

    <div th:if="${isCreator}">
        <a th:href="@{/forum/edit/{id}(id=${forum.forumId})}">编辑频道</a>
        <form method="post" th:action="@{/forum/dismiss}" style="display:inline">
            <input type="hidden" name="forumId" th:value="${forum.forumId}">
            <button type="submit" onclick="return confirm('确定要解散该频道吗？')">解散频道</button>
        </form>
    </div>

    <div th:if="${session.userId != null && !isCreator}">
        <form th:if="${!isMember && forum.auditState == '审核通过'}" method="post" th:action="@{/forum-member/join}" style="display:inline">
            <input type="hidden" name="forumId" th:value="${forum.forumId}">
            <button type="submit">加入频道</button>
        </form>
        <p th:if="${!isMember && forum.auditState != '审核通过'}">该频道尚未审核通过，暂不能加入</p>
        <form th:if="${isMember}" method="post" th:action="@{/forum-member/leave}" style="display:inline">
            <input type="hidden" name="forumId" th:value="${forum.forumId}">
            <button type="submit" onclick="return confirm('确定要退出该频道吗？')">退出频道</button>
        </form>
    </div>

    <p th:if="${session.userId == null}">
        <a th:href="@{/user/login}">登录后即可加入频道</a>
    </p>

    <div>
        <a th:href="@{/post/list/{id}(id=${forum.forumId})}">查看帖子</a>
        <a th:if="${session.userId != null}" th:href="@{/post/create/{id}(id=${forum.forumId})}">发布新帖</a>
    </div>

    <div>
        <a th:href="@{/forum/list}">返回频道列表</a>
    </div>
</body>
</html>
