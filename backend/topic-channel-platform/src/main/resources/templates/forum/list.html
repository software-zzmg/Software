<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主题频道列表</title>
</head>
<body>
    <h1>主题频道</h1>

    <div th:if="${session.userId}">
        <a th:href="@{/forum/create}">创建频道</a>
    </div>

    <form method="get" th:action="@{/forum/list}">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="搜索频道...">
        <button type="submit">搜索</button>
    </form>

    <p th:if="${keyword}">搜索结果："<span th:text="${keyword}"></span>"</p>

    <div th:if="${#lists.isEmpty(forums)}">
        <p>暂无频道</p>
    </div>

    <table th:if="${!#lists.isEmpty(forums)}">
        <thead>
            <tr>
                <th>频道名称</th>
                <th>简介</th>
                <th>状态</th>
                <th>创建时间</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="forum : ${forums}">
                <td><a th:href="@{/forum/detail/{id}(id=${forum.forumId})}" th:text="${forum.forumName}"></a></td>
                <td th:text="${forum.content}"></td>
                <td th:text="${forum.auditState}"></td>
                <td th:text="${forum.createTime}"></td>
            </tr>
        </tbody>
    </table>

    <div>
        <a th:href="@{/}">返回首页</a>
    </div>
</body>
</html>
