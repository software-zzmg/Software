<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建主题频道</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="page-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="main-content">

    <h1 class="page-title">创建主题频道</h1>

    <p th:if="${error}" class="error-text" th:text="${error}"></p>

    <form method="post" th:action="@{/forum/create}" class="form">
        <div class="form-group">
            <label>频道名称：</label>
            <input type="text" name="forumName" class="form-input" required>
        </div>
        <div class="form-group">
            <label>频道简介：</label>
            <textarea name="content" rows="5" class="form-textarea" required></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">提交创建</button>
            <a th:href="@{/}" class="btn btn-outline">取消</a>
        </div>
    </form>
        </div>
    </div>
</body>
</html>
