<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="page-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="main-content">

    <h1 class="page-title">搜索结果</h1>
    <p class="info-row">
        关键词：
        <span th:if="${keyword != ''}" th:text="${keyword}"></span>
        <span th:if="${keyword == ''}">请输入搜索关键词</span>
    </p>

    <div th:if="${keyword != ''}" class="form-actions">
        <form method="get" th:action="@{/search}" style="display:inline">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <input type="hidden" name="type" value="post">
            <button type="submit" class="btn" th:classappend="${type == 'post'} ? 'btn-primary' : 'btn-outline'" th:disabled="${type == 'post'}">帖子</button>
        </form>
        <form method="get" th:action="@{/search}" style="display:inline">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <input type="hidden" name="type" value="forum">
            <button type="submit" class="btn" th:classappend="${type == 'forum'} ? 'btn-primary' : 'btn-outline'" th:disabled="${type == 'forum'}">频道</button>
        </form>
        <form method="get" th:action="@{/search}" style="display:inline">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <input type="hidden" name="type" value="user">
            <button type="submit" class="btn" th:classappend="${type == 'user'} ? 'btn-primary' : 'btn-outline'" th:disabled="${type == 'user'}">用户</button>
        </form>
    </div>

    <div th:if="${type == 'post'}">
        <p th:if="${#lists.isEmpty(posts)}" class="empty-state">暂无匹配的帖子</p>
        <div class="table-wrapper"><table th:if="${!#lists.isEmpty(posts)}" class="table">
            <thead>
                <tr><th>标题</th><th>作者</th><th>所属频道</th><th>发布时间</th></tr>
            </thead>
            <tbody>
                <tr th:each="post : ${posts}">
                    <td><a th:href="@{/post/detail/{id}(id=${post.themePostId})}" th:text="${post.title}"></a></td>
                    <td th:text="${post.author.status == 'deleted'} ? '已注销用户' : ${post.author.userName}"></td>
                    <td><a th:href="@{/forum/detail/{id}(id=${post.forum.forumId})}" th:text="${post.forum.forumName}"></a></td>
                    <td th:text="${@timeFormatter.format(post.publishTime)}"></td>
                </tr>
            </tbody>
        </table></div>
    </div>

    <div th:if="${type == 'forum'}">
        <p th:if="${#lists.isEmpty(forums)}" class="empty-state">暂无匹配的频道</p>
        <div class="table-wrapper"><table th:if="${!#lists.isEmpty(forums)}" class="table">
            <thead>
                <tr><th>频道名称</th><th>简介</th><th>创建者</th><th>创建时间</th></tr>
            </thead>
            <tbody>
                <tr th:each="forum : ${forums}">
                    <td><a th:href="@{/forum/detail/{id}(id=${forum.forumId})}" th:text="${forum.forumName}"></a></td>
                    <td th:text="${forum.content}"></td>
                    <td th:text="${forum.creator.status == 'deleted'} ? '已注销用户' : ${forum.creator.userName}"></td>
                    <td th:text="${@timeFormatter.formatDate(forum.createTime)}"></td>
                </tr>
            </tbody>
        </table></div>
    </div>

    <div th:if="${type == 'user'}">
        <p th:if="${#lists.isEmpty(users)}" class="empty-state">暂无匹配的用户</p>
        <div class="table-wrapper"><table th:if="${!#lists.isEmpty(users)}" class="table">
            <thead>
                <tr><th>用户ID</th><th>用户名</th><th>注册时间</th></tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.userId}"></td>
                    <td th:text="${user.status == 'deleted'} ? ${user.userName} + '(已注销)' : ${user.userName}"></td>
                    <td th:text="${#strings.substring(user.registerTime.toString(), 0, 10)}"></td>
                </tr>
            </tbody>
        </table></div>
    </div>
        </div>
    </div>
</body>
</html>
