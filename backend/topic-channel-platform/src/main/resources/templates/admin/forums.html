<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审核频道</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div style="max-width:960px;margin:0 auto;padding:24px;">
    <h1 class="page-title">待审核频道</h1>

    <p class="empty-state" th:if="${#lists.isEmpty(forums)}">暂无待审核的频道</p>

    <table th:if="${!#lists.isEmpty(forums)}" class="table">
        <thead>
            <tr>
                <th>频道名称</th>
                <th>简介</th>
                <th>创建者</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="f : ${forums}">
                <td th:text="${f.forumName}"></td>
                <td th:text="${f.content}"></td>
                <td th:text="${f.creator.userName}"></td>
                <td th:text="${f.createTime}"></td>
                <td>
                    <form method="post" th:action="@{/admin/forums/{id}/approve(id=${f.forumId})}" style="display:inline">
                        <button type="submit" class="btn btn-primary btn-sm">通过</button>
                    </form>
                    <form method="post" th:action="@{/admin/forums/{id}/reject(id=${f.forumId})}" style="display:inline">
                        <button type="submit" class="btn btn-danger btn-sm">驳回</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <a th:href="@{/admin}" class="btn btn-outline">返回后台</a>
    </div>
</body>
</html>
