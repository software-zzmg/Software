<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审核帖子</title>
</head>
<body>
    <h1>待审核帖子</h1>

    <div th:if="${#lists.isEmpty(posts)}">
        <p>暂无待审核的帖子</p>
    </div>

    <table th:if="${!#lists.isEmpty(posts)}">
        <thead>
            <tr>
                <th>标题</th>
                <th>作者</th>
                <th>所属频道</th>
                <th>发布时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${posts}">
                <td>
                    <a th:href="@{/post/detail/{id}(id=${p.themePostId})}" th:text="${p.title}"></a>
                </td>
                <td th:text="${p.author.userName}"></td>
                <td th:text="${p.forum.forumName}"></td>
                <td th:text="${p.publishTime}"></td>
                <td>
                    <form method="post" th:action="@{/admin/posts/{id}/approve(id=${p.themePostId})}" style="display:inline">
                        <button type="submit">通过</button>
                    </form>
                    <form method="post" th:action="@{/admin/posts/{id}/reject(id=${p.themePostId})}" style="display:inline">
                        <button type="submit">驳回</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <a th:href="@{/admin}">返回后台</a>
</body>
</html>
