<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${forum.forumName} + ' - 帖子列表'">帖子列表</title>
</head>
<body>
    <h1 th:text="${forum.forumName} + ' - 帖子列表'">帖子列表</h1>

    <div th:if="${session.userId != null}">
        <a th:href="@{/post/create/{id}(id=${forum.forumId})}">发布新帖</a>
    </div>

    <div th:if="${#lists.isEmpty(posts)}">
        <p>暂无帖子</p>
    </div>

    <table th:if="${!#lists.isEmpty(posts)}">
        <thead>
            <tr>
                <th>标题</th>
                <th>作者</th>
                <th>发布时间</th>
                <th>审核状态</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="post : ${posts}">
                <td>
                    <a th:href="@{/post/detail/{id}(id=${post.themePostId})}" th:text="${post.title}"></a>
                </td>
                <td th:text="${post.author.userName}"></td>
                <td th:text="${post.publishTime}"></td>
                <td th:text="${post.auditState}"></td>
            </tr>
        </tbody>
    </table>

    <div>
        <a th:href="@{/forum/detail/{id}(id=${forum.forumId})}">返回频道详情</a>
        <a th:href="@{/forum/list}">浏览所有频道</a>
    </div>
</body>
</html>
