<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post == null ? '发布新帖' : '编辑帖子'}">发布新帖</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="page-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="main-content">

    <h1 class="page-title" th:text="${post == null ? '发布新帖' : '编辑帖子'}">发布新帖</h1>

    <p th:if="${forum}" class="info-row"><strong>频道：</strong><span th:text="${forum.forumName}"></span></p>
    <p th:if="${error}" class="error-text" th:text="${error}"></p>

    <form method="post" th:action="@{${post == null ? '/post/create' : '/post/edit'}}" class="form">
        <input th:if="${post != null}" type="hidden" name="postId" th:value="${post.themePostId}">
        <input type="hidden" name="forumId" th:value="${forum != null ? forum.forumId : post.forum.forumId}">
        <div class="form-group">
            <label>标题：</label>
            <input type="text" name="title" class="form-input" th:value="${post != null ? post.title : ''}" required>
        </div>
        <div class="form-group">
            <label>内容：</label>
            <textarea name="content" rows="10" class="form-textarea" required th:text="${post != null ? post.content : ''}"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary" th:text="${post == null ? '发布' : '保存修改'}">发布</button>
            <a th:if="${post != null}" th:href="@{/post/detail/{id}(id=${post.themePostId})}" class="btn btn-outline">取消</a>
            <a th:if="${post == null && forum != null}" th:href="@{/forum/detail/{id}(id=${forum.forumId})}" class="btn btn-outline">取消</a>
        </div>
    </form>
        </div>
    </div>
</body>
</html>
