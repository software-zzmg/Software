<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title} + ' - 帖子详情'">帖子详情</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="page-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="main-content">

    <h1 class="page-title" th:text="${post.title}">帖子标题</h1>

    <div class="card">
        <p class="info-row"><strong>作者：</strong><span th:text="${post.author.status == 'deleted'} ? '已注销用户' : ${post.author.userName}"></span></p>
        <p class="info-row"><strong>所属频道：</strong>
            <a th:href="@{/forum/detail/{id}(id=${post.forum.forumId})}" th:text="${post.forum.forumName}"></a>
        </p>
        <p class="info-row"><strong>发布时间：</strong><span th:text="${@timeFormatter.format(post.publishTime)}"></span></p>
    </div>

    <div class="card">
        <p th:text="${post.content}"></p>
    </div>

    <div class="form-actions">
        <form th:if="${currentUserId != null && !isCollected}" method="post" th:action="@{/collect/add}" style="display:inline">
            <input type="hidden" name="postId" th:value="${post.themePostId}">
            <button type="submit" class="btn btn-primary btn-sm">收藏</button>
        </form>
        <form th:if="${currentUserId != null && isCollected}" method="post" th:action="@{/collect/cancel}" style="display:inline">
            <input type="hidden" name="postId" th:value="${post.themePostId}">
            <button type="submit" class="btn btn-outline btn-sm" onclick="return confirm('确定要取消收藏吗？')">取消收藏</button>
        </form>
        <a th:if="${currentUserId == null}" th:href="@{/user/login}" class="btn btn-outline btn-sm">登录后即可收藏</a>
        <a th:href="@{/collect/my}" class="btn btn-outline btn-sm">我的收藏</a>
    </div>

    <div th:if="${isAuthor}" class="form-actions">
        <a href="javascript:void(0)" id="btn-edit-post" class="btn btn-outline">编辑帖子</a>
        <form method="post" th:action="@{/post/delete}" style="display:inline">
            <input type="hidden" name="postId" th:value="${post.themePostId}">
            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('确定要删除该帖子吗？')">删除帖子</button>
        </form>
    </div>

    <!-- 编辑帖子弹窗 -->
    <div th:if="${isAuthor}" id="modal-edit-post" class="modal-overlay">
        <div class="modal-card">
            <h2>编辑帖子</h2>
            <p id="modal-edit-error" class="error-text" style="display:none;"></p>
            <form id="form-edit-post" class="form" onsubmit="return false">
                <input type="hidden" name="postId" th:value="${post.themePostId}">
                <div class="form-group">
                    <label>标题：</label>
                    <input type="text" name="title" class="form-input" required maxlength="100" th:value="${post.title}">
                </div>
                <div class="form-group">
                    <label>内容：</label>
                    <textarea name="content" rows="8" class="form-textarea" maxlength="3000" required th:text="${post.content}"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">保存修改</button>
                    <button type="button" id="btn-cancel-edit" class="btn btn-outline">取消</button>
                </div>
            </form>
        </div>
    </div>

    <script th:if="${isAuthor}">
    (function() {
        var modal = document.getElementById('modal-edit-post');
        var btnOpen = document.getElementById('btn-edit-post');
        var btnCancel = document.getElementById('btn-cancel-edit');
        var form = document.getElementById('form-edit-post');
        var error = document.getElementById('modal-edit-error');
        var originalTitle = form.querySelector('[name="title"]').value;
        var originalContent = form.querySelector('[name="content"]').value;

        function open() { modal.classList.add('active'); }
        function close() {
            modal.classList.remove('active');
            form.querySelector('[name="title"]').value = originalTitle;
            form.querySelector('[name="content"]').value = originalContent;
            error.style.display = 'none'; error.textContent = '';
        }

        btnOpen.addEventListener('click', function(e) { e.preventDefault(); open(); });
        btnCancel.addEventListener('click', close);
        modal.addEventListener('click', function(e) { if (e.target === modal) close(); });

        form.addEventListener('submit', function() {
            error.style.display = 'none';
            var fd = new FormData(form);
            var params = new URLSearchParams(fd).toString();
            fetch('/post/edit', {
                method: 'POST',
                headers: { 'X-Requested-With': 'XMLHttpRequest', 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success) {
                    originalTitle = form.querySelector('[name="title"]').value;
                    originalContent = form.querySelector('[name="content"]').value;
                    close();
                    var toast = document.createElement('div');
                    toast.className = 'toast';
                    toast.textContent = data.toast;
                    document.body.appendChild(toast);
                    setTimeout(function() { toast.style.opacity = '0'; setTimeout(function() { toast.remove(); }, 500); }, 2500);
                    setTimeout(function() { location.reload(); }, 800);
                } else {
                    error.textContent = data.error || '编辑失败，请重试';
                    error.style.display = 'block';
                }
            })
            .catch(function() {
                error.textContent = '网络错误，请重试';
                error.style.display = 'block';
            });
        });
    })();
    </script>

    <!-- Comments section -->
    <hr class="divider">
    <h2 class="section-title">评论</h2>

    <p th:if="${error}" class="error-text" th:text="${error}"></p>

    <div th:if="${currentUserId != null && isMember}" class="card">
        <form method="post" th:action="@{/comment/create}">
            <input type="hidden" name="postId" th:value="${post.themePostId}">
            <div class="form-group">
                <textarea name="content" rows="3" class="form-textarea" maxlength="500" placeholder="写下你的评论..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">发表评论</button>
        </form>
    </div>

    <p th:if="${currentUserId != null && !isMember}" class="empty-state">需要加入频道后才能评论</p>
    <p th:if="${currentUserId == null}" class="empty-state"><a th:href="@{/user/login}">登录后即可评论</a></p>

    <p th:if="${#lists.isEmpty(comments)}" class="empty-state">暂无评论</p>

    <div th:each="c : ${comments}" class="card" style="padding:12px 16px;">
        <p>
            <strong th:text="${c.author.status == 'deleted'} ? '已注销用户' : ${c.author.userName}"></strong>
            <span style="color:#999;font-size:12px;" th:text="${@timeFormatter.format(c.publishTime)}"></span>
        </p>
        <p th:text="${c.content}"></p>
        <form th:if="${currentUserId != null && (currentUserId == c.author.userId || isAuthor)}"
              method="post" th:action="@{/comment/delete}" style="display:inline">
            <input type="hidden" name="commentId" th:value="${c.commentId}">
            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('确定要删除该评论吗？')">删除</button>
        </form>
    </div>

    <a th:href="@{/forum/detail/{id}(id=${post.forum.forumId})}" class="btn btn-outline">返回频道详情</a>
        </div>
    </div>
</body>
</html>
