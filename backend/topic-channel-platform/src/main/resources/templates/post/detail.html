<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title} + ' - 帖子详情'">帖子详情</title>
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>
    <hr>

    <div style="display:flex;">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div style="flex:1;padding:15px;">

    <h1 th:text="${post.title}">帖子标题</h1>

    <p><strong>作者：</strong><span th:text="${post.author.status == 'deleted'} ? '已注销用户' : ${post.author.userName}"></span></p>
    <p><strong>所属频道：</strong>
        <a th:href="@{/forum/detail/{id}(id=${post.forum.forumId})}" th:text="${post.forum.forumName}"></a>
    </p>
    <p><strong>发布时间：</strong><span th:text="${post.publishTime}"></span></p>
    <p><strong>审核状态：</strong><span th:text="${post.auditState}"></span></p>

    <hr>
    <div>
        <p th:text="${post.content}"></p>
    </div>
    <hr>

    <div>
        <form th:if="${currentUserId != null && !isCollected}" method="post" th:action="@{/collect/add}" style="display:inline">
            <input type="hidden" name="postId" th:value="${post.themePostId}">
            <button type="submit">收藏</button>
        </form>
        <form th:if="${currentUserId != null && isCollected}" method="post" th:action="@{/collect/cancel}" style="display:inline">
            <input type="hidden" name="postId" th:value="${post.themePostId}">
            <button type="submit" onclick="return confirm('确定要取消收藏吗？')">取消收藏</button>
        </form>
        <a th:if="${currentUserId == null}" th:href="@{/user/login}">登录后即可收藏</a>
        <a th:href="@{/collect/my}">我的收藏</a>
    </div>

    <div th:if="${isAuthor}">
        <a th:href="@{/post/edit/{id}(id=${post.themePostId})}">编辑帖子</a>
        <form method="post" th:action="@{/post/delete}" style="display:inline">
            <input type="hidden" name="postId" th:value="${post.themePostId}">
            <button type="submit" onclick="return confirm('确定要删除该帖子吗？')">删除帖子</button>
        </form>
    </div>

    <!-- Comments section -->
    <h2>评论</h2>

    <div th:if="${error}" style="color:red" th:text="${error}"></div>

    <div th:if="${currentUserId != null && isMember}">
        <form method="post" th:action="@{/comment/create}">
            <input type="hidden" name="postId" th:value="${post.themePostId}">
            <div>
                <textarea name="content" rows="3" placeholder="写下你的评论..." required></textarea>
            </div>
            <div>
                <button type="submit">发表评论</button>
            </div>
        </form>
    </div>

    <p th:if="${currentUserId != null && !isMember}">
        需要加入频道后才能评论
    </p>
    <p th:if="${currentUserId == null}">
        <a th:href="@{/user/login}">登录后即可评论</a>
    </p>

    <div th:if="${#lists.isEmpty(comments)}">
        <p>暂无评论</p>
    </div>

    <div th:each="c : ${comments}">
        <p>
            <strong th:text="${c.author.status == 'deleted'} ? '已注销用户' : ${c.author.userName}"></strong>
            <span th:text="${c.publishTime}"></span>
        </p>
        <p th:text="${c.content}"></p>
        <form th:if="${currentUserId != null && (currentUserId == c.author.userId || isAuthor)}"
              method="post" th:action="@{/comment/delete}" style="display:inline">
            <input type="hidden" name="commentId" th:value="${c.commentId}">
            <button type="submit" onclick="return confirm('确定要删除该评论吗？')">删除</button>
        </form>
        <hr>
    </div>

    <div>
        <a th:href="@{/forum/detail/{id}(id=${post.forum.forumId})}">返回频道详情</a>
    </div>
        </div>
    </div>
</body>
</html>
