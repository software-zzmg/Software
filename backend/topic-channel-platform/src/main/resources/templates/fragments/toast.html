<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<body>
<div th:fragment="toast" th:if="${toast}" id="toast" class="toast">
    <span th:text="${toast}"></span>
    <script>
        setTimeout(function() {
            var t = document.getElementById('toast');
            if (t) { t.style.opacity = '0'; setTimeout(function() { t.remove(); }, 500); }
        }, 3000);
    </script>
</div>
</body>
</html>
