<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<body>
<div th:fragment="toast" th:if="${toast}" id="toast" style="position:fixed;top:60px;right:20px;background:#4caf50;color:#fff;padding:12px 20px;border-radius:4px;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.2);transition:opacity 0.5s;">
    <span th:text="${toast}"></span>
</div>
<script th:if="${toast}">
    setTimeout(function() {
        var toast = document.getElementById('toast');
        if (toast) {
            toast.style.opacity = '0';
            setTimeout(function() { toast.remove(); }, 500);
        }
    }, 3000);
</script>
</body>
</html>
