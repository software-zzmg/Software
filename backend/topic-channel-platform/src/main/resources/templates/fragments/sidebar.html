<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<body>
<div th:fragment="sidebar" class="sidebar">
    <div class="sidebar-title">我加入的频道</div>
    <th:block th:if="${sidebarJoinedForums == null}">
        <p class="sidebar-empty"><a th:href="@{/user/login}">请先登录</a></p>
    </th:block>
    <th:block th:if="${sidebarJoinedForums != null && #lists.isEmpty(sidebarJoinedForums)}">
        <p class="sidebar-empty">暂未加入频道</p>
    </th:block>
    <ul th:if="${sidebarJoinedForums != null && !#lists.isEmpty(sidebarJoinedForums)}" class="sidebar-list">
        <li th:each="f : ${sidebarJoinedForums}" class="sidebar-item">
            <a th:href="@{/forum/detail/{id}(id=${f.forumId})}" th:text="${f.forumName}"></a>
        </li>
    </ul>

    <div class="sidebar-title">全部频道</div>
    <th:block th:if="${#lists.isEmpty(sidebarAllForums)}">
        <p class="sidebar-empty">暂无频道</p>
    </th:block>
    <ul th:if="${!#lists.isEmpty(sidebarAllForums)}" class="sidebar-list">
        <li th:each="f : ${sidebarAllForums}" class="sidebar-item">
            <a th:href="@{/forum/detail/{id}(id=${f.forumId})}" th:text="${f.forumName}"></a>
        </li>
    </ul>
</div>
</body>
</html>
