<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主题频道交流平台</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="page-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="main-content">

    <h1 class="page-title">最新帖子</h1>
    <p class="empty-state" th:if="${#lists.isEmpty(posts)}">暂无帖子</p>

    <table th:if="${!#lists.isEmpty(posts)}" class="table">
        <thead>
            <tr>
                <th>标题</th>
                <th>作者</th>
                <th>所属频道</th>
                <th>发布时间</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="post : ${posts}">
                <td>
                    <a th:href="@{/post/detail/{id}(id=${post.themePostId})}" th:text="${post.title}"></a>
                </td>
                <td th:text="${post.author.status == 'deleted'} ? '已注销用户' : ${post.author.userName}"></td>
                <td>
                    <a th:href="@{/forum/detail/{id}(id=${post.forum.forumId})}" th:text="${post.forum.forumName}"></a>
                </td>
                <td th:text="${post.publishTime}"></td>
            </tr>
        </tbody>
    </table>
        </div>
    </div>
</body>
</html>
