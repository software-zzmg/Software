<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主题频道交流平台</title>
</head>
<body>
    <!-- Navigation bar -->
    <div th:replace="~{fragments/nav :: nav}"></div>
    <hr>

    <h1>欢迎来到主题频道交流平台</h1>

    <!-- Posts list -->
    <div th:if="${#lists.isEmpty(posts)}">
        <p>暂无帖子</p>
    </div>

    <table th:if="${!#lists.isEmpty(posts)}">
        <thead>
            <tr>
                <th>标题</th>
                <th>作者</th>
                <th>所属频道</th>
                <th>发布时间</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="post : ${posts}">
                <td>
                    <a th:href="@{/post/detail/{id}(id=${post.themePostId})}" th:text="${post.title}"></a>
                </td>
                <td th:text="${post.author.userName}"></td>
                <td>
                    <a th:href="@{/forum/detail/{id}(id=${post.forum.forumId})}" th:text="${post.forum.forumName}"></a>
                </td>
                <td th:text="${post.publishTime}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
