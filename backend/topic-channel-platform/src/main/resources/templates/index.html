<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主题频道交流平台</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="page-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="main-content">

    <h1 class="page-title">最新帖子</h1>
    <p class="empty-state" th:if="${#lists.isEmpty(posts)}">暂无帖子</p>

    <div th:if="${!#lists.isEmpty(posts)}" class="post-list">
        <article th:each="post : ${posts}" class="post-card">
            <a class="post-card-link"
               th:href="@{/post/detail/{id}(id=${post.themePostId})}"
               th:aria-label="|查看帖子：${post.title}|"></a>
            <div class="post-card-content">
                <h2 class="post-card-title" th:text="${post.title}"></h2>
                <p class="post-card-summary"
                   th:text="${post.content == null || #strings.isEmpty(post.content) ? '暂无正文摘要' : (#strings.length(post.content) > 120 ? #strings.substring(post.content, 0, 120) + '...' : post.content)}"></p>
                <div class="post-card-meta">
                    <span th:text="${post.author.status == 'deleted'} ? '已注销用户' : ${post.author.userName}"></span>
                    <span>发布于</span>
                    <a class="post-card-channel"
                       th:href="@{/forum/detail/{id}(id=${post.forum.forumId})}"
                       th:text="${post.forum.forumName}"></a>
                    <span th:text="${@timeFormatter.format(post.publishTime)}"></span>
                </div>
                <div class="post-card-actions">
                    <a class="action-item" th:href="'/post/detail/' + ${post.themePostId} + '#comments'">&#128172; <span th:text="${@commentService.countApprovedByPostId(post.themePostId)}">0</span></a>
                    <a th:if="${session.userId}" href="javascript:void(0)" class="action-item collect-btn"
                       th:attr="data-id=${post.themePostId}"
                       th:data-collected="${collectedPostIds != null && collectedPostIds.contains(post.themePostId)}"
                       th:classappend="${collectedPostIds != null && collectedPostIds.contains(post.themePostId) ? 'collected' : ''}">
                       <th:block th:if="${collectedPostIds != null && collectedPostIds.contains(post.themePostId)}">&#9733; 已收藏</th:block>
                       <th:block th:unless="${collectedPostIds != null && collectedPostIds.contains(post.themePostId)}">&#9734; 收藏</th:block>
                    </a>
                </div>
            </div>
        </article>
    </div>

    <script th:if="${session.userId}">
    document.querySelectorAll('.collect-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault(); e.stopPropagation();
            var postId = this.getAttribute('data-id');
            var collected = this.getAttribute('data-collected') === 'true';
            var url = collected ? '/collect/cancel' : '/collect/add';
            fetch(url, {
                method:'POST',
                headers:{'X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded'},
                body:'postId=' + encodeURIComponent(postId)
            })
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (d.success !== false) {
                    if (collected) {
                        btn.setAttribute('data-collected', 'false');
                        btn.classList.remove('collected');
                        btn.innerHTML = '&#9734; 收藏';
                    } else {
                        btn.setAttribute('data-collected', 'true');
                        btn.classList.add('collected');
                        btn.innerHTML = '&#9733; 已收藏';
                    }
                }
            });
        });
    });
    </script>
        </div>
    </div>
</body>
</html>
