<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主题频道交流平台</title>
</head>
<body>
    <h1>欢迎来到主题频道交流平台</h1>
    <div th:if="${session.userId}">
        <a th:href="@{/user/info}">个人信息</a>
    </div>
    <div th:unless="${session.userId}">
        <a th:href="@{/user/login}">登录</a>
        <a th:href="@{/user/register}">注册</a>
    </div>
</body>
</html>
